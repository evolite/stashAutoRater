name: Stash Auto Rater
description: Sets performer, studio, group, and gallery ratings to the Bayesian average of their rated scenes and images.
url: https://codeberg.org/surging9143/stashAutoRater
version: 1.0.6
exec:
  - python3
  - "{pluginDir}/stashAutoRater.py"
interface: raw
tasks:
  - name: Rate All
    description: Recalculates ratings for all enabled entity types.
    defaultArgs:
      mode: rateAll
  - name: Rate All Performers
    description: Recalculates ratings for all performers.
    defaultArgs:
      mode: rateAllPerformers
  - name: Rate All Studios
    description: Recalculates ratings for all studios.
    defaultArgs:
      mode: rateAllStudios
  - name: Rate All Groups
    description: Recalculates ratings for all groups.
    defaultArgs:
      mode: rateAllGroups
  - name: Rate All Galleries
    description: Recalculates ratings for all galleries.
    defaultArgs:
      mode: rateAllGalleries
settings:
  # --- What to rate ---
  rate_performers:
    displayName: "Rate Performers"
    description: "Automatically rate performers when their scenes, images, or profile are updated."
    type: BOOLEAN
  rate_studios:
    displayName: "Rate Studios"
    description: "Automatically rate studios when their scenes, images, or profile are updated."
    type: BOOLEAN
  rate_groups:
    displayName: "Rate Groups"
    description: "Automatically rate groups when their scenes or profile are updated."
    type: BOOLEAN
  rate_galleries:
    displayName: "Rate Galleries"
    description: "Automatically rate galleries when their images or profile are updated."
    type: BOOLEAN
  # --- Boosts (set to 0 or leave blank to disable) ---
  o_boost:
    displayName: "O-Count Boost"
    description: "Log-scale bonus per o-count. Applies to performers, studios, and groups. For galleries, sums o-count across linked scenes. Suggested: 2."
    type: STRING
  play_boost:
    displayName: "Play-Count Boost"
    description: "Log-scale bonus per total scene plays. Applies to performers, studios, and groups. Suggested: 1."
    type: STRING
  watch_boost:
    displayName: "Watch Time Boost"
    description: "Log-scale bonus per total hours watched across scenes. Applies to performers, studios, and groups. Suggested: 1."
    type: STRING
  favorite_boost:
    displayName: "Favourite Boost"
    description: "Flat point bonus for entities marked as favourites. Suggested: 5."
    type: STRING
  tag_boost:
    displayName: "Tag Boost"
    description: "Log-scale bonus per favourited tag matched across scenes and images. Suggested: 2."
    type: STRING
hooks:
  - name: Auto-rate entities on update
    description: Recalculates ratings when a scene, image, or entity is updated.
    triggeredBy:
      - Scene.Update.Post
      - Image.Update.Post
      - Performer.Update.Post
      - Studio.Update.Post
      - Group.Update.Post
      - Gallery.Update.Post
